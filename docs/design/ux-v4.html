<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lowk · Макеты UX v4</title>
<style>
:root{--pg:#09090a;--bg:#111113;--side:#0d0d0f;--panel:#17171a;--line:#27272b;--line2:#3a3a40;--tx:#ececee;--tx2:#8e8e96;--tx3:#80808a;--hv:rgba(255,255,255,.05);--sel:rgba(255,255,255,.085);--ac:#8ba6c4;--acbg:rgba(139,166,196,.15);--acfg:#0b1118;--rec:#ff4d4f;--live:#46d37a;--move:#ffc24a;--sh:0 30px 80px rgba(0,0,0,.5);--r:8px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--pg);color:var(--tx);font:14px/20px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 48px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:-.01em}
.seg{display:flex;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:4px 12px;border-radius:6px;font-size:12px;line-height:20px;color:var(--tx2)}
.seg button.on{background:var(--ac);color:var(--acfg);font-weight:600}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3)}
.sp{flex:1}
.note{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 24px;font-size:12px;line-height:16px;color:var(--tx2);margin:0 0 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--side)}
.note b{color:var(--tx)}.note p{margin:0}.note .pl b{color:var(--live)}.note .mi b{color:var(--move)}
.scroller{overflow-x:auto;border-radius:12px}
/* ---------- app window ---------- */
.win{position:relative;width:1180px;height:640px;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;box-shadow:var(--sh);text-align:left}
.win.col{flex-direction:column}
.sb{width:232px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:4px;position:relative}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;height:32px;padding:0 4px;margin-bottom:8px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--hv);font-size:13px;white-space:nowrap;color:var(--tx)}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acfg);font-weight:600}
.btn.sm{height:28px;padding:0 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{background:var(--hv);color:var(--tx)}
.btn.nc{width:100%;justify-content:center;margin-bottom:8px}
kbd{font:600 10px/16px ui-monospace,Menlo,monospace;padding:0 4px;border-radius:4px;border:1px solid var(--line2);color:var(--tx2);background:var(--hv);white-space:nowrap}
.pri kbd{border-color:rgba(11,17,24,.35);color:var(--acfg);background:rgba(11,17,24,.1)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rec);flex:none}
.pri .dot{background:var(--acfg)}
.it{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:var(--r);color:var(--tx2);font-size:13px;width:100%}
.it:hover{background:var(--hv);color:var(--tx)}.it.on{background:var(--sel);color:var(--tx)}
.it .c{margin-left:auto;font-size:12px;color:var(--tx3)}
.it .ic{width:16px;text-align:center;flex:none;color:var(--tx3)}
.it span.t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{padding-left:16px}
.sub .it{height:28px;font-size:12px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 4px}
.sec button{all:unset;cursor:pointer;color:var(--tx3);width:20px;text-align:center;border-radius:4px}.sec button:hover{background:var(--hv);color:var(--tx)}
.hr{height:1px;background:var(--line);margin:8px 0}
.sbf{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:12px;height:48px;padding:0 20px;border-bottom:1px solid var(--line);flex:none;font-size:13px;color:var(--tx2)}
.hd b{color:var(--tx);font-weight:550}.hd .sl{color:var(--tx3)}
.pg{flex:1;min-height:0;overflow:hidden;padding:20px 28px;display:flex;flex-direction:column;gap:16px}
h1{font-size:24px;line-height:32px;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:15px;line-height:20px;margin:0;font-weight:600}
.meta{color:var(--tx2);font-size:13px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;line-height:16px;padding:0 8px;border-radius:99px;background:var(--hv);border:1px solid var(--line);color:var(--tx2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex:none}
.tabs button{all:unset;cursor:pointer;height:40px;padding:0 12px;display:inline-flex;align-items:center;font-size:13px;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--tx)}.tabs button.on{color:var(--tx);border-color:var(--ac);font-weight:550}
.list{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}.row:hover{background:var(--hv)}
.row .n{font-weight:550}.row .m{font-size:12px;color:var(--tx2)}.row .r{margin-left:auto;font-size:12px;color:var(--tx3)}
.row .ext{font:600 10px/16px ui-monospace,Menlo,monospace;padding:2px 6px;border-radius:4px;background:var(--hv);border:1px solid var(--line);color:var(--tx2);min-width:40px;text-align:center}
.pin{color:var(--ac)}.pin.off{color:var(--tx3)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.card:hover{border-color:var(--line2)}
.card .av{width:32px;height:32px;border-radius:8px;background:var(--hv);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;color:var(--tx2);margin-bottom:8px}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--tx2);font-size:13px}
.empty h2{color:var(--tx)}.empty p{margin:0;max-width:420px}
.ta{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px;min-height:96px;color:var(--tx);font-size:13px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:24px;min-height:0;flex:1}
.ut{display:grid;grid-template-columns:64px 56px 1fr;gap:8px;font-size:13px;margin-bottom:8px}.ut i{font:12px/20px ui-monospace,Menlo,monospace;color:var(--tx3);font-style:normal}.ut b{color:var(--tx2);font-weight:600}
.ai{border:1px solid var(--line);border-left:2px solid var(--ac);background:var(--panel);border-radius:8px;padding:8px 12px;margin:0 0 8px 120px;font-size:13px}
.ai small{color:var(--ac);font-size:11px;display:block}
.prop{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}.prop span:first-child{color:var(--tx2)}
.src{display:inline-flex;gap:4px;align-items:center;font-size:11px;padding:0 8px;border-radius:99px;border:1px solid var(--acbg);background:var(--acbg);color:var(--ac)}
.pop{position:absolute;z-index:20;left:12px;top:92px;width:264px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh);padding:12px;display:flex;flex-direction:column;gap:8px}
.pop.b{left:auto;right:12px;top:52px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.sel{height:32px;border:1px solid var(--line);border-radius:var(--r);background:var(--side);display:flex;align-items:center;padding:0 8px;color:var(--tx);font-size:13px;text-transform:none;letter-spacing:0}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--tx2);text-transform:none;letter-spacing:0}.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac)}
.srow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.srow small{display:block;color:var(--tx2);font-size:12px}
.topnav{display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;background:var(--side);border-bottom:1px solid var(--line);flex:none;position:relative}
.topnav .it{width:auto;padding:0 12px}
.mm{position:relative}
.menu{position:absolute;z-index:15;right:0;top:36px;min-width:210px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:4px;box-shadow:var(--sh)}
.menu .it{height:30px}
/* ---------- tour ---------- */
.dim{position:relative;z-index:31;box-shadow:0 0 0 2000px rgba(0,0,0,.62);outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
.coach{position:absolute;z-index:60;width:320px;background:var(--panel);border:1px solid var(--ac);border-radius:12px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:8px}
.coach h2{font-size:15px}.coach p{margin:0;font-size:13px;color:var(--tx2)}.coach p b{color:var(--tx)}
.coach .ft{display:flex;align-items:center;gap:8px;margin-top:4px}
.prog{display:flex;gap:4px}.prog i{width:16px;height:3px;border-radius:2px;background:var(--line2)}.prog i.on{background:var(--ac)}
.try{border:1px dashed var(--ac);border-radius:8px;padding:8px 12px;background:var(--acbg);font-size:12px;color:var(--tx);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.try.ok{border-style:solid;color:var(--live);border-color:var(--live);background:rgba(70,211,122,.1)}
.ovl{position:absolute;z-index:32;right:32px;bottom:32px;width:420px;border-radius:12px;background:rgba(12,12,15,.88);border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 28px rgba(0,0,0,.4);font-size:12px;line-height:16px;transition:transform .35s}
.ovl.moved{transform:translate(-70px,-70px);border:1px dashed var(--move)}
.ovl .oh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.ovl .tm{font:600 12px/16px ui-monospace,Menlo,monospace}
.ovl .oc{padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.ovl .sys{color:#9a9aa3}.ovl .ans{margin-top:4px;padding:8px;border-radius:8px;background:rgba(139,166,196,.12);border-left:2px solid var(--ac);min-height:34px}
.ovl .of{display:flex;gap:8px;padding:8px 12px;border-top:1px solid rgba(255,255,255,.08);color:#8e8e96;align-items:center}
.ovl .cap{position:absolute;left:0;right:0;top:-20px;text-align:center;font-size:11px;color:var(--tx3)}
.ovl.hl{z-index:41;outline:2px solid var(--ac);outline-offset:2px;box-shadow:0 0 0 2000px rgba(0,0,0,.62)}
.badge{background:var(--ac);color:var(--acfg);border-radius:99px;font-weight:700;padding:0 8px}
.toast{position:absolute;z-index:50;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 16px;font-size:13px;box-shadow:var(--sh)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.ovl{transition:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="g" viewBox="8 48 84 54"><path d="M10 100C20 99 22 92 22 84C22 63 34 51 50 51C66 51 78 63 78 84C78 92 80 99 90 100Z" fill="#eef2f8"/><path d="M32 71H46A7 5 0 0 1 32 71Z" fill="#0f1724"/><path d="M54 69H68A7 6.2 0 0 1 54 69Z" fill="#0f1724"/><circle cx="41" cy="73.5" r="1.6" fill="#b9d0ee"/><circle cx="63" cy="72" r="1.8" fill="#b9d0ee"/></symbol></svg>
<div class="wrap">
  <div class="bar">
    <span class="logo"><svg width="26" height="17"><use href="#g"/></svg>Lowk · макеты UX v4</span>
    <div class="seg" id="vseg"><button data-v="A" class="on">Вариант A · сайдбар (рекомендуем)</button><button data-v="B">Вариант B · верхние разделы</button><button data-v="T">Тур первого запуска</button></div>
    <span class="sp"></span>
    <div class="seg" id="sseg"></div>
  </div>
  <div class="note" id="note"></div>
  <div class="scroller"><div class="win" id="win"></div></div>
</div>
<script>
const S={v:'A',screen:'home',ftab:'calls',ctab:'tr',nc:false,menu:false,tour:null,tried:{},toast:null};
const $=s=>document.querySelector(s);
const MARK='<svg width="22" height="14"><use href="#g"/></svg>';
const SCREENS={A:[['home','Главная'],['folder','Папка'],['call','Созвон'],['empty','Пустая папка'],['trash','Корзина'],['settings','Настройки']],B:[['home','Папки'],['folder','Папка'],['call','Созвон'],['empty','Пустая папка']],T:[['tour','Тур — шаги']]};
const NOTES={
A:'<p><b>Одна модель.</b> Постоянный сайдбар на каждом экране: «Новый созвон», Главная, Поиск, дерево Папок, Несортированные, Корзина, Настройки. Папка — рабочее пространство с вкладками Созвоны / Документы / Инструкции.</p><p class="pl"><b>+</b> мгновенное переключение между папками и созвонами, drag-and-drop в дерево, масштабируется на M2–M3, ближе к текущему коду.</p><p class="mi"><b>−</b> дерево занимает 232 px; «Главная» — отдельный экран.</p>',
B:'<p><b>Верхняя навигация.</b> Главная · Папки · Поиск · Корзина · Настройки. Папки — карточки, внутри — крошки и вкладки; дерева нет.</p><p class="pl"><b>+</b> просторно, проще для новичка, меньше «админки».</p><p class="mi"><b>−</b> смена папки = 2 клика, неудобный drag-and-drop, хуже при десятках папок и ежедневных созвонах.</p>',
T:'<p><b>Мини-тур после онбординга.</b> 6 шагов поверх настоящего интерфейса. «Пропустить» — на каждом шаге и по Esc. Повтор: Настройки → Общие → «Показать тур».</p><p class="pl"><b>Попробуйте:</b> шаги 3–5 интерактивны — нажмите ⌘↵ / удерживайте ⌥ / ⌘⇧S (или кнопку-подсказку). Демо локальное, без сети, ответ помечен «пример».</p>'};
const FOLDERS=[['Acme Corp',4],['Nova Bank',2],['Собеседования',2],['Личное',0]];
const item=(ic,t,c,on,act,arg='',extra='')=>`<button class="it ${on?'on':''}" data-act="${act}" data-arg="${arg}" ${extra}><span class="ic">${ic}</span><span class="t">${t}</span>${c!==''&&c!=null?`<span class="c">${c}</span>`:''}</button>`;
const crumbs=(a)=>a.map((x,i)=>i<a.length-1?`<span>${x}</span><span class="sl">/</span>`:`<b>${x}</b>`).join('');

/* ---------- popover ---------- */
function popover(cls=''){return `<div class="pop ${cls}"><div class="fld">Папка<div class="sel">Acme Corp <span style="margin-left:auto;color:var(--tx3)">v</span></div></div><div class="fld">Источник звука<div class="sel">Zoom <span style="margin-left:auto;color:var(--tx3)">v</span></div></div><div class="fld">Языки созвона<div class="chips"><span class="chip on">Русский</span><span class="chip on">English</span><span class="chip">+ ещё</span></div></div><button class="btn pri" data-act="start"><span class="dot"></span>Начать запись<kbd>⇧⌘R</kbd></button></div>`}

/* ---------- content blocks ---------- */
const callsList=(n=4)=>`<div class="list">${[['Квартальное планирование Q4','Сегодня, 13:10 · 1 ч 12 мин','Саммари готово'],['Демо для CFO','18 окт · 48 мин','Нет саммари'],['Weekly sync','13 окт · 31 мин','Нет саммари'],['Обсуждение договора','10 окт · 55 мин','Нет саммари']].slice(0,n).map(r=>`<div class="row" data-act="call"><div><div class="n">${r[0]}</div><div class="m">${r[1]}</div></div><span class="r">${r[2]}</span><span class="r">⋯</span></div>`).join('')}</div>`;
const docsTab=()=>`<div style="display:flex;justify-content:space-between;align-items:center"><span class="meta">Закреплённые идут в нейронку всегда (звёздочка). Остальные — по релевантности.</span><button class="btn sm">+ Добавить документ</button></div><div class="list">${[['PDF','Договор-2026.pdf','24 стр. · конвертирован в .md',1],['DOCX','Бриф на кампанию.docx','6 стр. · готов',1],['MD','Прайс.md','индексируется…',0]].map(r=>`<div class="row"><span class="ext">${r[0]}</span><div><div class="n">${r[1]}</div><div class="m">${r[2]}</div></div><span class="r pin ${r[3]?'':'off'}">${r[3]?'★ закреплён':'☆'}</span></div>`).join('')}</div><div class="empty" style="padding:16px">Перетащите сюда PDF, DOCX, TXT/MD, таблицы, слайды и картинки</div>`;
const instrTab=()=>`<span class="meta">Идёт в нейронку всегда, на каждый ответ. 168 / 500</span><div class="ta">Клиент — финтех, общение на «вы». Отвечай кратко, цифры приводи с единицами измерения. Термины оставляй на английском (EBITDA, CAC). Не обещай сроков без согласования.</div>`;
function folderBody(){
  const t=S.ftab;
  return `<div><h1>Acme Corp</h1><div class="meta" style="display:flex;gap:12px;align-items:center;margin-top:4px">4 созвона · 3 документа<span class="tags"><span class="tag"># продажи</span><span class="tag"># финтех</span><span class="tag">+ тег</span></span></div></div>
  <div class="tabs">${[['calls','Созвоны · 4'],['docs','Документы · 3'],['instr','Инструкции']].map(x=>`<button class="${t===x[0]?'on':''}" data-act="ftab" data-arg="${x[0]}">${x[1]}</button>`).join('')}</div>${t==='calls'?callsList():t==='docs'?docsTab():instrTab()}`;
}
function emptyBody(){
  const t=S.ftab;
  const em=t==='calls'?`<div class="empty"><h2>В этой папке пока нет созвонов</h2><p>Начните созвон здесь — запись сохранится в «Личное» в Markdown.</p><button class="btn pri" data-act="nc"><span class="dot"></span>Новый созвон здесь</button></div>`
  :t==='docs'?`<div class="empty"><h2>Документов пока нет</h2><p>Перетащите PDF, DOCX, TXT/MD, таблицы, слайды. Lowk будет подсказывать из них во время созвона.</p><button class="btn">+ Добавить документ</button></div>`
  :`<div class="empty"><h2>Инструкции для нейронки</h2><p>Например: «Клиент — финтех, общение на «вы». Термины оставляй на английском». Это учитывается в каждом ответе по этой папке.</p><button class="btn">Написать инструкцию</button></div>`;
  return `<div><h1>Личное</h1><div class="meta">0 созвонов · 0 документов</div></div><div class="tabs">${[['calls','Созвоны'],['docs','Документы'],['instr','Инструкции']].map(x=>`<button class="${t===x[0]?'on':''}" data-act="ftab" data-arg="${x[0]}">${x[1]}</button>`).join('')}</div>${em}`;
}
function callBody(){
  const t=S.ctab;
  const tr=`<div><div class="ut"><i>00:23:41</i><b>Система</b><span style="color:var(--tx2)">А какой у вас сейчас EBITDA margin по сегменту B2B?</span></div><div class="ai"><small>AI · Кратко ответить · 00:23:44</small><b>EBITDA margin по B2B — 23,4%</b> за Q3 (+2,1 п.п.). <span class="src">Договор-2026.pdf · с. 12</span> <span class="src">Weekly sync · 13 окт</span><div style="color:var(--tx2);font-style:italic;margin-top:4px;border-top:1px dashed var(--line);padding-top:4px">Мой ответ: «Если коротко, около двадцати трёх процентов…»</div></div><div class="ut"><i>00:24:10</i><b>Я</b><span>Сейчас покажу слайд, мы как раз это считали.</span></div></div>`;
  const other={sum:`<div class="list" style="padding:16px"><h2>Главное</h2><p class="meta">3–5 пунктов · решения · задачи (кто/что) · вопросы ко мне и мои ответы. Теги предлагаются после созвона: <span class="tag"># продажи</span> <span class="tag">принять</span></p></div>`,qa:`<div class="list" style="padding:16px"><h2>Вопросы к AI · 3</h2><p class="meta">Вопрос → подсказка → мой ответ. Здесь же в будущем: чат с нейронкой по итогам созвона.</p></div>`,sh:`<div class="list" style="padding:16px"><h2>Скриншоты · 2</h2><p class="meta">00:24:10 · весь экран · слайд 7 из 18</p></div>`,src:`<div class="list" style="padding:16px"><h2>Источники</h2><p class="meta">Какие документы и прошлые созвоны использовались в ответах этого созвона.</p></div>`};
  return `<div style="display:flex;align-items:flex-start;gap:12px"><div><h1>Квартальное планирование Q4</h1><div class="meta" style="margin-top:4px">21 окт 2026 · 1 ч 12 мин · Zoom · RU + EN <span class="tags" style="display:inline-flex;margin-left:8px"><span class="tag"># продажи</span><span class="tag"># финансы</span></span></div></div><span class="sp"></span><button class="btn pri" data-act="noop">Саммари</button>
  <div class="mm"><button class="btn" data-act="menu">⋯</button>${S.menu?`<div class="menu"><button class="it">Переместить в папку…</button><button class="it">Экспорт .md / .zip</button><button class="it">Показать исходник .md</button><div class="hr" style="margin:4px"></div><button class="it" style="color:var(--rec)">В корзину</button></div>`:''}</div></div>
  <div class="tabs">${[['tr','Транскрипт'],['sum','Саммари'],['qa','Вопросы к AI · 3'],['sh','Скриншоты · 2'],['src','Источники']].map(x=>`<button class="${t===x[0]?'on':''}" data-act="ctab" data-arg="${x[0]}">${x[1]}</button>`).join('')}</div>${t==='tr'?tr:other[t]}`;
}
const callSide=()=>`<aside style="width:248px;flex:none;border-left:1px solid var(--line);padding:20px 16px"><div class="lbl" style="margin-bottom:8px">О созвоне</div><div class="prop"><span>Источник</span><span>Zoom</span></div><div class="prop"><span>Языки</span><span>RU + EN</span></div><div class="prop"><span>Распознавание</span><span>Whisper v3 turbo</span></div><div class="prop"><span>Папка</span><span>Acme Corp</span></div><div class="meta" style="margin-top:12px;font-size:12px">Панель сворачивается. Действия с созвоном — в меню ⋯ сверху, не здесь.</div></aside>`;
const homeBody=()=>`<div><h1>Добрый день</h1><div class="meta">11 созвонов в 4 папках</div></div>
<div><div class="lbl" style="margin-bottom:8px">Недавние</div>${callsList(3)}</div>
<div class="empty" style="align-items:flex-start;text-align:left"><h2>Как начать</h2><p>Нажмите «Новый созвон» — оверлей покажет субтитры и подскажет ответ по ⌘↵. Пока созвонов нет, здесь будет это объяснение.</p><button class="btn" data-act="tour">Показать тур (1 мин)</button></div>`;
const trashBody=()=>`<div style="display:flex;align-items:center"><div><h1>Корзина</h1><div class="meta">Удалённое хранится, пока вы не очистите</div></div><span class="sp"></span><button class="btn" style="color:var(--rec)">Очистить корзину</button></div><div class="list">${['Старая демо-запись','Тестовый звонок'].map(n=>`<div class="row"><div><div class="n" style="color:var(--tx2)">${n}</div><div class="m">21 сент · 20 мин</div></div><span class="r"><button class="btn sm">Восстановить</button></span></div>`).join('')}</div>`;
const settingsBody=()=>`<div><h1>Настройки</h1></div><div class="tabs">${['Общие','Горячие клавиши','Оверлей','Нейронка и распознавание','Хранение','Разрешения'].map((x,i)=>`<button class="${i===0?'on':''}">${x}</button>`).join('')}</div><div><div class="srow"><div>Язык интерфейса</div><div class="sel" style="width:120px">Авто</div></div><div class="srow"><div>Языки созвона по умолчанию<small>Можно изменить перед каждым созвоном</small></div><div class="chips"><span class="chip on">Русский</span><span class="chip on">English</span></div></div><div class="srow"><div>Тур по Lowk<small>Короткое обучение поверх интерфейса</small></div><button class="btn" data-act="tour">Показать тур</button></div><div class="srow"><div>Первоначальная настройка<small>Разрешения, звук, ключи</small></div><button class="btn">Пройти заново</button></div></div>`;

/* ---------- layouts ---------- */
function sidebarA(){
  const on=S.screen, inF=['folder','call','empty'].includes(on);
  return `<aside class="sb"><div class="brand">${MARK}Lowk</div>
  <button class="btn pri nc ${S.tour===1?'dim':''}" data-act="nc" data-t="nc"><span class="dot"></span>Новый созвон<kbd>⇧⌘R</kbd></button>
  ${item('⌂','Главная','',on==='home','go','home')}${item('⌕','Поиск','⌘K',false,'noop')}
  <div class="sec"><span class="lbl">Папки</span><button data-act="noop" title="Новая папка">+</button></div>
  <div data-t="folders" class="${S.tour===6?'dim':''}">${FOLDERS.map((f,i)=>item('▸',f[0],f[1]||'',inF&&((i===0&&on!=='empty')||(i===3&&on==='empty')),'go',i===3?'empty':'folder')+(inF&&((i===0&&on!=='empty')||(i===3&&on==='empty'))&&i===0?`<div class="sub">${['Квартальное планирование…','Демо для CFO','Weekly sync'].map((x,j)=>item('','• '+x,'',on==='call'&&j===0,'go','call')).join('')}</div>`:'')).join('')}
  ${item('▫','Несортированные',2,false,'go','trash')}${item('🗑'.replace('🗑','×'),'Корзина',2,on==='trash','go','trash')}</div>
  <div class="sbf"><div class="hr"></div>${item('⚙','Настройки','',on==='settings','go','settings')}${item('?','Показать тур','',false,'tour')}</div>
  ${S.nc?popover():''}</aside>`;
}
function bodyFor(){const s=S.screen;return s==='home'?homeBody():s==='folder'?folderBody():s==='empty'?emptyBody():s==='call'?callBody():s==='trash'?trashBody():settingsBody()}
function crumbFor(){const s=S.screen;return s==='home'?['Главная']:s==='folder'?['Папки','Acme Corp',({calls:'Созвоны',docs:'Документы',instr:'Инструкции'})[S.ftab]]:s==='empty'?['Папки','Личное']:s==='call'?['Папки','Acme Corp','Созвоны','Квартальное планирование Q4']:s==='trash'?['Корзина']:['Настройки','Общие']}
function renderA(){
  const w=$('#win');w.className='win';
  w.innerHTML=sidebarA()+`<div class="main"><div class="hd">${crumbs(crumbFor())}<span class="sp"></span><span class="meta" style="font-size:12px">${S.screen==='folder'?'Перетащите файл — добавится в Документы':''}</span></div><div style="display:flex;flex:1;min-height:0"><div class="pg" style="flex:1;min-width:0">${bodyFor()}</div>${S.screen==='call'?callSide():''}</div></div>`;
}
function renderB(){
  const w=$('#win');w.className='win col';const on=S.screen;
  const nav=[['home','Главная и папки'],['noop','Поиск'],['trash','Корзина'],['settings','Настройки']];
  w.innerHTML=`<div class="topnav"><span class="brand" style="margin:0">${MARK}Lowk</span>${nav.map(n=>`<button class="it ${(on==='home'&&n[0]==='home')||(on===n[0])?'on':''}" data-act="${n[0]==='noop'?'noop':'go'}" data-arg="${n[0]}">${n[1]}</button>`).join('')}<span class="sp"></span><button class="btn pri" data-act="nc"><span class="dot"></span>Новый созвон<kbd>⇧⌘R</kbd></button>${S.nc?popover('b'):''}</div>
  <div class="main"><div class="hd">${crumbs(on==='home'?['Папки']:crumbFor())}</div><div style="display:flex;flex:1;min-height:0"><div class="pg" style="flex:1;min-width:0">${on==='home'?`<div><h1>Папки</h1><div class="meta">11 созвонов в 4 папках · последний — сегодня</div></div><div class="cards">${FOLDERS.map((f,i)=>`<div class="card" data-act="go" data-arg="${i===3?'empty':'folder'}"><div class="av">${f[0][0]}</div><b>${f[0]}</b><span class="meta" style="font-size:12px">${f[1]} созв. · ${i===0?3:0} док.</span></div>`).join('')}<div class="empty" style="padding:16px;cursor:pointer">+ Новая папка</div></div><div class="meta">Системные: Несортированные (2) · Корзина (2) — в верхнем меню</div>`:bodyFor()}</div>${on==='call'?callSide():''}</div></div>`;
}
/* ---------- tour ---------- */
const STEPS=[
 null,
 {t:'Новый созвон',p:'Начните здесь: выберите <b>папку</b>, <b>источник звука</b> и <b>языки</b> созвона. Или нажмите <b>⇧⌘R</b> из любого приложения.',pos:'left:248px;top:76px'},
 {t:'Субтитры в оверлее',p:'Во время созвона сверху оверлея бегут <b>субтитры</b>: что говорят вам и что говорите вы. Оверлей — отдельное окно, его <b>не видно на демонстрации экрана</b>.',pos:'left:360px;top:230px',ov:1},
 {t:'Спросите нейронку',p:'<b>⌘↵</b> — спросить: ответ придёт на языке вопроса. <b>⌘⇧↵</b> — «Дополни мой ответ»: ИИ добавит детали к тому, что вы уже сказали.',pos:'left:300px;top:150px',ov:1,try:'ask'},
 {t:'Двигайте и кликайте',p:'<b>Удерживайте ⌥</b> — оверлей прилипнет к курсору. <b>Удерживайте ⌃</b> — по оверлею можно кликать, пока держите; отпустили — снова сквозной.',pos:'left:300px;top:150px',ov:1,try:'move'},
 {t:'Скриншот',p:'<b>⌘⇧S</b> — снимок всех экранов, он уйдёт с ближайшим вопросом. <b>⌘⇧A</b> — только область.',pos:'left:300px;top:150px',ov:1,try:'shot'},
 {t:'Где всё хранится',p:'Каждый созвон — файл Markdown на вашем компьютере: <b>Папка → Созвон</b>. Добавьте в папку документы и инструкции — нейронка учтёт их в ответах.',pos:'left:248px;top:150px'}];
const TRY={ask:['Нажмите ⌘↵','⌘↵','Ответ пошёл — это пример, без сети'],move:['Удерживайте ⌥','удерживать ⌥','Оверлей следует за курсором'],shot:['Нажмите ⌘⇧S','⌘⇧S','Снимок в очереди — значок 1 на оверлее']};
function tourOverlay(){
  const st=S.tour,d=STEPS[st];
  const ovl=`<div class="ovl ${st>=2&&st<=5?'hl':''} ${S.moving?'moved':''}" id="ovl"><div class="cap">Оверлей (отдельное окно, пример)</div><div class="oh"><span class="dot"></span><span class="tm">00:23:44</span><span style="color:#9a9aa3">Zoom</span><span class="sp"></span><span>Кратко</span><kbd>⌘↵</kbd></div><div class="oc"><div class="sys">Система: А какой у вас сейчас EBITDA margin по сегменту B2B?</div><div>Я: Сейчас посмотрю цифры…</div><div class="ans">${S.tried.ask?'<b>Пример:</b> EBITDA margin по B2B — 23,4% за Q3, +2,1 п.п. к Q2.':'<span style="color:#6f6f78">Ответ появится здесь</span>'}</div></div><div class="of"><span>Скриншоты</span>${S.tried.shot?'<span class="badge">1</span>':'<span>0</span>'}<span class="sp"></span><kbd>⌥ двигать</kbd><kbd>⌃ клик</kbd></div></div>`;
  let h=st>=2&&st<=5?ovl:'';
  if(st===0)return `<div class="coach" style="left:50%;top:50%;transform:translate(-50%,-50%);width:380px;z-index:60;box-shadow:0 0 0 2000px rgba(0,0,0,.62),var(--sh)"><div style="display:flex;align-items:center;gap:8px">${MARK}<h2>Всё готово. Показать, как это работает?</h2></div><p>Короткий тур поверх настоящего интерфейса — около минуты. Пропустить можно в любой момент, а потом запустить из «Настройки → Общие».</p><div class="ft"><button class="btn pri" data-act="tnext">Показать тур</button><button class="btn ghost" data-act="tskip">Пропустить</button></div></div>`;
  const tr=d.try?TRY[d.try]:null,ok=d.try&&S.tried[d.try];
  const tryEl=tr?`<div class="try ${ok?'ok':''}">${ok?'Готово. '+tr[2]:'Попробуйте: <button class="btn sm" data-act="try" data-arg="'+d.try+'" id="tbtn">'+tr[1]+'</button> '+(d.try==='move'?'(нажмите и держите)':'')}</div>`:'';
  const prog=`<div class="prog">${[1,2,3,4,5,6].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
  return h+`<div class="coach" style="${d.pos}"><div class="lbl">Шаг ${st} из 6</div><h2>${d.t}</h2><p>${d.p}</p>${tryEl}<div class="ft">${prog}<span class="sp"></span><button class="btn ghost sm" data-act="tskip">Пропустить</button>${st>1?'<button class="btn sm" data-act="tprev">Назад</button>':''}<button class="btn pri sm" data-act="tnext">${st===6?'Готово':'Далее'}</button></div></div>`;
}
function render(){
  const v=S.v;
  document.querySelectorAll('#vseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#note').innerHTML=NOTES[v];
  const sc=SCREENS[v];if(!sc.some(x=>x[0]===S.screen))S.screen=sc[0][0];
  $('#sseg').innerHTML=sc.length>1?sc.map(x=>`<button class="${S.screen===x[0]?'on':''}" data-act="screen" data-arg="${x[0]}">${x[1]}</button>`).join(''):'<button class="on" data-act="tour">Запустить тур заново</button>';
  if(v==='B')renderB();else{ if(v==='T'){const keep=S.screen;S.screen='folder';renderA();S.screen=keep;}else renderA(); }
  if(S.tour!==null)$('#win').insertAdjacentHTML('beforeend',tourOverlay());
  if(S.toast)$('#win').insertAdjacentHTML('beforeend',`<div class="toast">${S.toast}</div>`);
}
function startTour(){S.v='T';S.tour=0;S.tried={};S.toast=null;S.nc=false;render();}
function endTour(skipped){S.tour=null;S.tried={};S.toast=skipped?'Тур можно запустить заново: Настройки → Общие → «Показать тур» или «?» в сайдбаре':null;render();if(skipped)setTimeout(()=>{S.toast=null;render()},4000);}
document.addEventListener('click',e=>{
  const sv=e.target.closest('#vseg button');if(sv){const v=sv.dataset.v;S.v=v;S.nc=false;S.menu=false;S.toast=null;if(v==='T'){S.tour=0;S.tried={};}else S.tour=null;render();return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,g=el.dataset.arg;
  if(a==='screen'){S.screen=g;S.nc=S.menu=false;S.ftab='calls';render();}
  else if(a==='go'){S.screen=g;S.nc=S.menu=false;S.ftab='calls';if(S.v==='T'){S.v='A';S.tour=null;}render();}
  else if(a==='call'){S.screen='call';S.ctab='tr';render();}
  else if(a==='ftab'){S.ftab=g;render();}
  else if(a==='ctab'){S.ctab=g;render();}
  else if(a==='nc'){S.nc=!S.nc;render();}
  else if(a==='menu'){S.menu=!S.menu;render();}
  else if(a==='start'){S.nc=false;S.toast='Запись пошла: оверлей появился на основном мониторе (в макете не показан)';render();setTimeout(()=>{S.toast=null;render()},3000);}
  else if(a==='tour')startTour();
  else if(a==='tnext'){if(S.tour>=6)endTour(false);else{S.tour++;render();}}
  else if(a==='tprev'){S.tour--;render();}
  else if(a==='tskip')endTour(true);
  else if(a==='try'&&g!=='move'){S.tried[g]=1;render();}
});
/* hold-to-move: pointer down on the try button holds, release returns */
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-act="try"][data-arg="move"]');if(b){S.tried.move=1;S.moving=1;render();}});
document.addEventListener('pointerup',()=>{if(S.moving){S.moving=0;const o=$('#ovl');if(o)o.classList.remove('moved');}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.tour!==null){endTour(true);return;}
  if(S.tour===null)return;
  if(S.tour===3&&(e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();S.tried.ask=1;render();}
  if(S.tour===4&&e.key==='Alt'&&!S.moving){S.tried.move=1;S.moving=1;render();}
  if(S.tour===5&&(e.metaKey||e.ctrlKey)&&e.shiftKey&&e.key.toLowerCase()==='s'){e.preventDefault();S.tried.shot=1;render();}
});
document.addEventListener('keyup',e=>{if(e.key==='Alt'&&S.tour===4){S.moving=0;const o=$('#ovl');if(o)o.classList.remove('moved');}});
render();
</script></body></html>

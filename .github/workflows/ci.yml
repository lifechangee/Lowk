name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *" # nightly: OS jobs always run
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Decides whether the expensive macOS/Windows jobs run (private-repo minutes).
  changes:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.f.outputs.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            os:
              - 'crates/lowk-audio/**'
              - 'crates/lowk-stealth/**'
              - 'crates/lowk-input/**'
              - 'crates/lowk-platform/**'
              - 'crates/lowk-capture/**'
              - 'crates/lowk-app/**'
              - 'crates/lowk-types/**'
              - 'crates/lowk-stt/**'
              - 'crates/lowk-session/**'
              - 'workers/**'
              - 'tools/build-worker.sh'
              - 'ui/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: cargo fmt --all -- --check
      # lowk-app needs WebKitGTK on Linux; it is linted in the macOS job.
      - run: cargo clippy --workspace --exclude lowk-app --all-targets -- -D warnings
      - run: cargo xtask check-deps
      - run: QA_GUARD_COMPILE=0 tools/qa/check-no-qa-release.sh # the qa feature must never reach a release build
      - run: cargo deny check

  test-pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude lowk-app

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui check
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build
      - run: pnpm --dir ui size
      # TODO(WP10): Playwright overflow/screenshot tests in RU and EN.
      - name: licenses (frontend)
        run: pnpm --dir ui licenses list --prod --json > /dev/null

  test-macos:
    needs: changes
    if: needs.changes.outputs.os == 'true' || github.event_name != 'pull_request'
    # macos-15: apple-metal (via screencapturekit) needs the macOS 26 SDK (MTLTensor, Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: bindings are fresh
        run: |
          cargo xtask bindings
          git diff --exit-code -- ui/src/lib/ipc/bindings.ts
      # The STT worker (ggml + Metal, needs CMake) is staged as the Tauri sidecar and must end up
      # inside the .app next to the executable, where `find_worker` looks first.
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: app bundle with the STT worker
        run: |
          tools/build-worker.sh
          cd crates/lowk-app && cargo tauri build --config tauri.bundle.conf.json --bundles app
          cd ../..
          APP=target/release/bundle/macos/Lowk.app/Contents/MacOS
          ls -l "$APP"
          test -x "$APP/lowk-stt-worker"
          "$APP/lowk-stt-worker" --version

  # Windows: compile + clippy + tests that need no desktop. Runtime/stealth
  # probe testing is deferred until PC access (see probe-win below).
  test-windows:
    needs: changes
    if: needs.changes.outputs.os == 'true' || github.event_name != 'pull_request'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Compile-check of the STT worker (ggml CPU build; Vulkan/CUDA stay optional features).
      - name: stt worker builds
        shell: bash
        run: cargo build --release --manifest-path workers/lowk-stt-worker/Cargo.toml --no-default-features

  # Disabled until the owner has Windows PC access (docs/ARCHITECTURE.md 11).
  probe-win:
    if: false
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: echo "stealth capture-probe lands with WP2 (tools/stealth-probe)"

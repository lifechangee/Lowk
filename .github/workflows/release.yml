name: release

# Tag push v* -> build both platforms (release-build.yml) -> DRAFT GitHub release with installers, latest.json and checksums.
# Tags v0.1.0-rc.N become pre-releases (the updater ignores them). Publishing the draft is a manual step: docs/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      rc: ${{ steps.v.outputs.rc }}
      sign: ${{ steps.v.outputs.sign }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag, versions, key guard
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          tools/release/check-versions.sh "$tag"
          tools/release/check-no-keys.sh
          rc=false; case "$tag" in *-rc.*) rc=true;; esac
          sign=true
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            sign=false
            if [ "$rc" = true ]; then
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: this rc has NO signed updater artifacts and no latest.json"
            else
              echo "::error::TAURI_SIGNING_PRIVATE_KEY (and _PASSWORD) secrets are required for a non-rc release: docs/release.md"
              exit 1
            fi
          fi
          { echo "version=$ver"; echo "rc=$rc"; echo "sign=$sign"; } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/release-build.yml
    with:
      windows_gpu: vulkan
      platforms: both
      sign_updater: ${{ needs.prepare.outputs.sign == 'true' }}
    secrets: inherit

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RC: ${{ needs.prepare.outputs.rc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release files
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          tools/release/changelog-section.sh "$VERSION" > notes.md
          if ls dist/*.sig >/dev/null 2>&1; then
            tools/release/make-latest-json.sh dist "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" notes.md
          else
            echo "::warning::no updater signatures: latest.json not generated"
          fi
          (cd dist && sha256sum $(ls | grep -v '^SHA256SUMS.txt$') > SHA256SUMS.txt && cat SHA256SUMS.txt)
          tools/release/size-report.sh dist | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l dist
      - name: Draft release
        run: |
          flags=(--draft --title "Lowk $VERSION" --notes-file notes.md --verify-tag)
          if [ "$RC" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"

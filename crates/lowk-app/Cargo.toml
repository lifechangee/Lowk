[package]
name = "lowk-app"
description = "Lowk Tauri shell: windows, capabilities, command/event glue. The only crate that knows Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "lowk"

[lib]
name = "lowk_app"

[[bin]]
name = "lowk"
path = "src/main.rs"

[dependencies]
lowk-types.workspace = true
lowk-platform.workspace = true
lowk-store.workspace = true
lowk-stealth.workspace = true
lowk-input.workspace = true
lowk-session.workspace = true
lowk-audio.workspace = true
lowk-stt.workspace = true
lowk-capture.workspace = true
lowk-index.workspace = true
lowk-ingest.workspace = true
lowk-llm.workspace = true
blake3.workspace = true
libc = "0.2"
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio.workspace = true
url = "2"
base64 = "0.22"
minisign-verify = "0.3"
parking_lot.workspace = true
regex = "1"
zip.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
tauri.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true

[build-dependencies]
tauri-build.workspace = true

[features]
# Set by the Tauri CLI for release builds (embeds the frontend).
custom-protocol = ["tauri/custom-protocol"]
# QA only: localhost token-protected control channel to drive the real app (docs/testing.md).
# Never enabled by default or in release builds (compile_error! + tools/qa/check-no-qa-release.sh).
qa = []
# WebRTC AEC3 on the mic (needs meson + ninja to build); enable for release builds.
aec = ["lowk-audio/aec"]

[lints]
workspace = true

<!doctype html>
<meta charset="utf-8">
<title>Lowk tone backdrop</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Backdrop page for tools/qa/tone-e2e.mjs. Served by the harness from 127.0.0.1; polls /state for the rectangles to
     paint (global top-left screen points) and acknowledges each one with /ack, so the harness knows the pixels are on
     screen. It is a normal web page in the user's default browser, i.e. what the overlay really sits on top of. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #stage { position: fixed; inset: 0; }
  #stage div { position: absolute; }
  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 600 22px/1.4 -apple-system, sans-serif;
          color: #fff; background: #000; padding: 18px 26px; border: 2px solid #888; border-radius: 12px; text-align: center; z-index: 9; }
</style>
<div id="stage"></div>
<div id="hint">Lowk tone test: waiting for the harness...<br>For the best result make this window fill the screen (Ctrl+Cmd+F).</div>
<script>
  let seq = -1, timer = 0;
  const stage = document.getElementById('stage'), hint = document.getElementById('hint');
  // viewport of this page in global top-left screen points (browser chrome on top is the outer-inner height difference)
  function viewport() {
    const full = innerWidth >= screen.width - 1 && innerHeight >= screen.height - 1;
    const top = full ? 0 : Math.max(0, outerHeight - innerHeight - (outerWidth - innerWidth) / 2);
    return { x: screenX + (full ? 0 : (outerWidth - innerWidth) / 2), y: screenY + top, w: innerWidth, h: innerHeight, full, sw: screen.width, sh: screen.height };
  }
  const post = (path, body) => fetch(path, { method: 'POST', body: JSON.stringify(body) }).catch(() => {});
  async function tick() {
    let s;
    try { s = await (await fetch('/state', { cache: 'no-store' })).json(); } catch { return; }
    const vp = viewport();
    if (s.seq !== seq) {
      seq = s.seq;
      if (s.bye) { hint.textContent = 'Done. You can close this tab.'; hint.style.display = 'block'; stage.textContent = ''; post('/ack', { seq, vp }); setTimeout(() => window.close(), 500); return; }
      stage.textContent = '';
      for (const r of s.rects || []) {
        const d = document.createElement('div');
        d.style.cssText = `left:${r.x - vp.x}px;top:${r.y - vp.y}px;width:${r.w}px;height:${r.h}px;background:rgb(${r.c[0]},${r.c[1]},${r.c[2]})`;
        stage.appendChild(d);
      }
      hint.style.display = (s.rects || []).length ? 'none' : 'block';
      // two frames so the compositor has presented the new pixels before the harness is told
      requestAnimationFrame(() => requestAnimationFrame(() => post('/ack', { seq, vp })));
    } else if (!(s.rects || []).length) {
      post('/hello', { vp });
    }
  }
  timer = setInterval(tick, 100);
  addEventListener('resize', () => { seq = -2; });
</script>
